[build]
  command = "pnpm build"
  publish = ".next"

# Explicitly enable the server adapter for both Git and source-upload builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"
  NEXT_TELEMETRY_DISABLED = "1"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
  framework = "next"
